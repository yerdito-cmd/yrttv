<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>TV Player</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin:0;
  background:#000;
  color:#fff;
  font-family: monospace;
  overflow:hidden;
}

/* PLAYER */
#player {
  position:fixed;
  width:100%;
  height:100%;
  border:none;
}

/* UI */
#ui {
  position:fixed;
  bottom:0;
  width:100%;
  background:rgba(0,0,0,0.7);
  padding:10px;
  display:flex;
  gap:10px;
  overflow-x:auto;
}

.video-btn {
  background:#111;
  border:1px solid #333;
  padding:8px 12px;
  cursor:pointer;
  border-radius:5px;
  white-space:nowrap;
}

.video-btn:hover {
  background:#ff0050;
}

/* BOTONES */
#controls {
  position:fixed;
  top:10px;
  left:10px;
  z-index:9999;
}

button {
  margin-right:5px;
  padding:6px 10px;
  background:#111;
  color:#fff;
  border:1px solid #333;
  cursor:pointer;
}

/* CRT EFFECT */
#crt {
  pointer-events:none;
  position:fixed;
  width:100%;
  height:100%;
  display:none;
}

/* scanlines */
#crt::before {
  content:\"\"; 
  position:absolute;
  width:100%;
  height:100%;
  background: repeating-linear-gradient(
    to bottom,
    rgba(255,255,255,0.05) 0px,
    rgba(255,255,255,0.05) 1px,
    transparent 1px,
    transparent 2px
  );
}

/* noise */
#crt::after {
  content:\"\"; 
  position:absolute;
  width:100%;
  height:100%;
  background:url('https://media.giphy.com/media/oEI9uBYSzLpBK/giphy.gif');
  opacity:0.05;
}

.crt-on #crt {
  display:block;
}

</style>
</head>

<body>

<iframe id="player" allow="autoplay"></iframe>

<div id="crt"></div>

<div id="controls">
  <button onclick="toggleCRT()">📺 CRT</button>
</div>

<div id="ui"></div>

<script>

// 👉 PON AQUÍ TU PLAYLIST
const playlistId = "PLtXBcDuMV6J_Y28Kje7WxvfYdvjfCOWrd";

let videos = [];
let currentIndex = 0;

// cargar lista desde youtube (modo simple embed index)
function loadVideo(index) {
  currentIndex = index;
  document.getElementById("player").src =
    `https://www.youtube.com/embed?list=${playlistId}&index=${index}&autoplay=1&mute=1`;
}

// generar lista visual
function generateList() {
  const ui = document.getElementById("ui");
  ui.innerHTML = "";

  for (let i = 1; i <= 20; i++) {
    const btn = document.createElement("div");
    btn.className = "video-btn";
    btn.innerText = "Video " + i;
    btn.onclick = () => loadVideo(i);
    ui.appendChild(btn);
  }
}

// CRT toggle
function toggleCRT() {
  document.body.classList.toggle("crt-on");
}

// autoplay inicial random
function randomStart() {
  let rand = Math.floor(Math.random() * 20) + 1;
  loadVideo(rand);
}

generateList();
randomStart();

</script>

</body>
</html>
