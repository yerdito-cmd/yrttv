<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>TV Player Web</title>

<style>
body {
    margin: 0;
    background: #000;
    font-family: Arial;
    color: white;
    overflow: hidden;
}

/* VIDEO FULL */
#player {
    position: fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:1;
}

#player iframe {
    width:100%;
    height:100%;
    border:none;
}

/* UI PANEL */
#ui {
    position: fixed;
    right: 0;
    top: 0;
    width: 300px;
    height: 100%;
    background: rgba(0,0,0,0.85);
    z-index:2;
    overflow-y:auto;
    padding:10px;
}

/* CANALES */
.channel {
    margin-bottom: 15px;
    border-bottom:1px solid #333;
    padding-bottom:10px;
}

.channel h3 {
    margin:5px 0;
    cursor:pointer;
}

/* PLAYLIST */
.playlist {
    display:none;
}

.video {
    display:flex;
    margin:5px 0;
    cursor:pointer;
}

.video img {
    width:80px;
    height:45px;
    margin-right:10px;
}

.video:hover {
    background:#222;
}
</style>
</head>

<body>

<!-- PLAYER -->
<div id="player">
    <iframe id="videoFrame" src=""></iframe>
</div>

<!-- UI -->
<div id="ui"></div>

<script>

/* =========================
   DATA (EDITA AQUÍ)
========================= */

const channels = [
{
    name: "🎵 Música",
    videos: [
        {id:"dQw4w9WgXcQ", title:"Video 1"},
        {id:"3JZ_D3ELwOQ", title:"Video 2"},
        {id:"L_jWHffIx5E", title:"Video 3"}
    ]
},
{
    name: "🔥 Mix",
    videos: [
        {id:"kJQP7kiw5Fk", title:"Video 4"},
        {id:"fJ9rUzIMcZQ", title:"Video 5"}
    ]
}
];


/* =========================
   UI GENERATION
========================= */

const ui = document.getElementById("ui");

channels.forEach((channel, cIndex) => {

    const chDiv = document.createElement("div");
    chDiv.className = "channel";

    const title = document.createElement("h3");
    title.textContent = channel.name;

    const list = document.createElement("div");
    list.className = "playlist";

    title.onclick = () => {
        list.style.display = list.style.display === "block" ? "none" : "block";
    };

    channel.videos.forEach((vid, vIndex) => {

        const vidDiv = document.createElement("div");
        vidDiv.className = "video";

        vidDiv.innerHTML = `
            <img src="https://img.youtube.com/vi/${vid.id}/mqdefault.jpg">
            <span>${vid.title}</span>
        `;

        vidDiv.onclick = () => {
            playVideo(cIndex, vIndex);
        };

        list.appendChild(vidDiv);
    });

    chDiv.appendChild(title);
    chDiv.appendChild(list);
    ui.appendChild(chDiv);
});


/* =========================
   PLAYER LOGIC
========================= */

let currentChannel = 0;
let currentVideo = 0;
let timeoutCheck;

function playVideo(c, v) {
    currentChannel = c;
    currentVideo = v;

    const vid = channels[c].videos[v];

    const iframe = document.getElementById("videoFrame");
    iframe.src = `https://www.youtube.com/embed/${vid.id}?autoplay=1`;

    startFailCheck();
}


/* =========================
   AUTO NEXT SI FALLA
========================= */

function startFailCheck() {
    clearTimeout(timeoutCheck);

    timeoutCheck = setTimeout(() => {
        nextVideo();
    }, 8000); // si no carga en 8s -> siguiente
}

function nextVideo() {
    currentVideo++;

    if (currentVideo >= channels[currentChannel].videos.length) {
        currentVideo = 0;
    }

    playVideo(currentChannel, currentVideo);
}


/* =========================
   AUTO START
========================= */

playVideo(0,0);

</script>

</body>
</html>
