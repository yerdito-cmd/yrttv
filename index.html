<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>YRDtv PRO Lite</title>

<style>
body { margin:0; background:#000; font-family: monospace; overflow:hidden; }

#player {
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
}

#menu {
  position:fixed;
  top:20px;
  left:50%;
  transform:translateX(-50%);
  z-index:9999;
}

button {
  background:rgba(255,255,255,0.2);
  border:none;
  color:#fff;
  padding:10px;
  margin:5px;
  cursor:pointer;
}

#videoList {
  position:fixed;
  bottom:0;
  width:100%;
  height:220px;
  background:rgba(0,0,0,0.95);
  overflow-x:auto;
  white-space:nowrap;
  display:none;
  z-index:9999;
}

.videoCard {
  display:inline-block;
  width:200px;
  margin:10px;
  cursor:pointer;
}

.videoCard img {
  width:100%;
  border-radius:8px;
}

.videoCard:hover { transform:scale(1.1); }
</style>
</head>

<body>

<iframe id="player" src="" allowfullscreen></iframe>

<div id="menu">
  <button onclick="toggleList()">📺 Lista</button>
</div>

<div id="videoList"></div>

<script>
let playlistId = "PLtXBcDuMV6J_Y28Kje7WxvfYdvjfCOWrd";
let videos = [];
let currentIndex = 0;
let checkTimeout;

// 🔧 CARGAR PLAYLIST (CON FIX CORS)
function loadPlaylist() {
  fetch("https://api.allorigins.win/raw?url=" + encodeURIComponent("https://www.youtube.com/feeds/videos.xml?playlist_id=" + playlistId))
    .then(r => r.text())
    .then(str => new DOMParser().parseFromString(str, "text/xml"))
    .then(data => {
      let entries = data.getElementsByTagName("entry");
      videos = [];

      for (let i = 0; i < entries.length; i++) {
        let id = entries[i].getElementsByTagName("yt:videoId")[0].textContent;
        let title = entries[i].getElementsByTagName("title")[0].textContent;
        let thumb = entries[i].getElementsByTagName("media:thumbnail")[0].getAttribute("url");

        videos.push({ id, title, thumb });
      }

      if (videos.length === 0) throw new Error("Playlist vacía");

      currentIndex = Math.floor(Math.random() * videos.length);
      playVideo();
      renderList();
    })
    .catch(err => {
      console.error(err);
      document.getElementById("videoList").innerHTML = "❌ Error cargando playlist";
    });
}

// ▶️ PLAY VIDEO
function playVideo() {
  clearTimeout(checkTimeout);

  let player = document.getElementById("player");
  player.src = "https://www.youtube.com/embed/" + videos[currentIndex].id + "?autoplay=1";

  // fallback si falla
  checkTimeout = setTimeout(() => {
    console.log("Saltando video...");
    nextVideo();
  }, 8000);
}

// ⏭ SIGUIENTE
function nextVideo() {
  currentIndex++;
  if (currentIndex >= videos.length) currentIndex = 0;
  playVideo();
}

// 🎬 RENDER LISTA
function renderList() {
  let container = document.getElementById("videoList");
  container.innerHTML = "";

  videos.forEach((v, i) => {
    let div = document.createElement("div");
    div.className = "videoCard";

    div.innerHTML = `
      <img src="${v.thumb}">
      <p>${v.title}</p>
    `;

    div.onclick = () => {
      currentIndex = i;
      playVideo();
    };

    container.appendChild(div);
  });
}

// 📺 TOGGLE LISTA
function toggleList() {
  let el = document.getElementById("videoList");
  el.style.display = (el.style.display === "none") ? "block" : "none";
}

// 🎯 DETECTAR FIN (hack)
window.addEventListener("message", function(event) {
  if (event.data && event.data.event === "onStateChange" && event.data.info === 0) {
    nextVideo();
  }
});

// 🚀 START
loadPlaylist();
</script>

</body>
</html>
